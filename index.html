<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HCL GUVI | Learner Feedback Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111111;
    --muted:#6B7280;
    --border:#E4E8EC;
    --surface:#FFFFFF;
    --wash:#F5FAF7;
    --green:#0BD752;
    --green-dark:#08B843;
    --blue:#0062A8;
    --success:#08B843;
    --error:#DC2626;
    --radius:14px;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    font-family:'Inter', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(11,215,82,0.09), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(0,98,168,0.07), transparent 55%),
      var(--wash);
    min-height:100vh;
    padding:40px 16px 64px;
  }

  .page{
    max-width:640px;
    margin:0 auto;
  }

  /* ---- Logo lockup ---- */
  .brand{
    display:flex;
    justify-content:center;
    padding:22px 20px;
    margin-bottom:20px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
  }
  .brand img{
    height:58px;
    width:auto;
    max-width:100%;
    display:block;
  }

  /* ---- Card ---- */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:36px 32px;
    box-shadow:0 1px 2px rgba(10,15,20,0.04);
  }

  h1{
    font-family:'Poppins', sans-serif;
    font-size:24px;
    line-height:1.3;
    margin:0 0 8px;
  }
  .subtitle{
    color:var(--muted);
    font-size:14.5px;
    line-height:1.55;
    margin:0 0 28px;
  }

  fieldset{
    border:0;
    padding:0;
    margin:0 0 24px;
  }
  legend{
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:13px;
    color:var(--blue);
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin-bottom:14px;
    padding:0;
  }

  .field{margin-bottom:18px;}
  .field:last-child{margin-bottom:0;}

  label{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:6px;
  }
  label .req{color:var(--green-dark);}
  label .opt{color:var(--muted); font-weight:400;}

  input[type="text"],
  input[type="email"],
  textarea{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:14.5px;
    color:var(--ink);
    background:#FBFBFD;
    border:1px solid var(--border);
    border-radius:10px;
    padding:11px 13px;
    transition:border-color .15s ease, background .15s ease;
  }
  textarea{resize:vertical; min-height:88px; line-height:1.5;}

  input:hover, textarea:hover{border-color:#C9CEDA;}
  input:focus, textarea:focus{
    outline:none;
    border-color:var(--green-dark);
    background:#FFFFFF;
    box-shadow:0 0 0 3px rgba(11,215,82,0.15);
  }

  .hint{font-size:12.5px; color:var(--muted); margin-top:5px;}

  .row-two{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  @media (max-width:560px){
    .row-two{grid-template-columns:1fr;}
    .card{padding:28px 20px;}
  }

  button[type="submit"]{
    width:100%;
    border:none;
    cursor:pointer;
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:15px;
    color:#0A2E12;
    padding:14px 20px;
    border-radius:10px;
    background:var(--green);
    transition:background .15s ease, transform .05s ease;
  }
  button[type="submit"]:hover{background:var(--green-dark);}
  button[type="submit"]:active{transform:translateY(1px);}
  button[type="submit"]:disabled{opacity:0.6; cursor:not-allowed;}

  .status{
    margin-top:16px;
    font-size:14px;
    border-radius:10px;
    padding:12px 14px;
    display:none;
  }
  .status.success{
    display:block;
    background:#F0FDF4;
    color:var(--success);
    border:1px solid #BBF7D0;
  }
  .status.error{
    display:block;
    background:#FEF2F2;
    color:var(--error);
    border:1px solid #FECACA;
  }

  .footer-note{
    text-align:center;
    color:var(--muted);
    font-size:12.5px;
    margin-top:22px;
  }
</style>
</head>

      <h1>Learner feedback &amp; task tracker</h1>
      <p class="subtitle">Tell us about the task you're working on, what's blocking you, and any suggestions you have. Your response is added directly to our tracking sheet.</p>

      <form id="feedbackForm">

        <fieldset>
          <legend>About you</legend>
          <div class="field row-two">
            <div>
              <label for="name">Name <span class="req">*</span></label>
              <input type="text" id="name" name="name" required autocomplete="name">
            </div>
            <div>
              <label for="email">Email ID <span class="req">*</span></label>
              <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@hclguvi.com">
            </div>
          </div>
          <div class="field">
            <label for="hyrexId">HyreX organisation ID <span class="opt">(optional)</span></label>
            <input type="text" id="hyrexId" name="hyrexId" placeholder="e.g. My Organization">
          </div>
        </fieldset>

        <fieldset>
          <legend>The task</legend>
          <div class="field">
            <label for="project">Sample task / project <span class="req">*</span></label>
            <input type="text" id="project" name="project" required placeholder="e.g. Music Streaming App">
          </div>
          <div class="field">
            <label for="tech">Needed technologies <span class="req">*</span></label>
            <input type="text" id="tech" name="tech" required placeholder="e.g. MERN, MySQL">
          </div>
        </fieldset>

        <fieldset>
          <legend>What's happening</legend>
          <div class="field">
            <label for="issue">Issue <span class="req">*</span></label>
            <textarea id="issue" name="issue" required placeholder="Briefly describe the issue you ran into"></textarea>
          </div>
          <div class="field">
            <label for="description">Description <span class="opt">(optional)</span></label>
            <textarea id="description" name="description" placeholder="Add more detail if it helps explain the issue"></textarea>
          </div>
          <div class="field">
            <label for="notes">Notes <span class="opt">(optional)</span></label>
            <textarea id="notes" name="notes" placeholder="Anything else worth flagging"></textarea>
          </div>
          <div class="field">
            <label for="suggestions">Suggestions <span class="opt">(optional)</span></label>
            <textarea id="suggestions" name="suggestions" placeholder="What would help resolve or prevent this?"></textarea>
          </div>
        </fieldset>

        <button type="submit" id="submitBtn">Submit response</button>
        <div class="status" id="statusBox"></div>
      </form>
    </div>

  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    if (ENDPOINT.indexOf('PASTE_YOUR') === 0) {
      statusBox.className = 'status error';
      statusBox.textContent = 'Form endpoint not configured yet — paste your Apps Script Web App URL into ENDPOINT.';
      return;
    }

    const data = new URLSearchParams(new FormData(form));

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting…';
    statusBox.className = 'status';

    fetch(ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      body: data
    })
    .then(function () {
      statusBox.className = 'status success';
      statusBox.textContent = 'Thanks! Your response has been recorded.';
      form.reset();
    })
    .catch(function () {
      statusBox.className = 'status error';
      statusBox.textContent = 'Something went wrong sending your response. Please try again.';
    })
    .finally(function () {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit response';
    });
  });
</script>
</body>
</html>
